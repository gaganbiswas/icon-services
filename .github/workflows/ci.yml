name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: icon
          POSTGRES_PASSWORD: ci-only-password
          # Name must end with _test: integration tests truncate every table.
          POSTGRES_DB: icon_service_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U icon -d icon_service_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mail:
        image: axllent/mailpit:v1.34.0
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start S3-compatible storage (SeaweedFS, CI-only credentials)
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -e S3_ACCESS_KEY_ID=ci-only-access-key -e S3_SECRET_ACCESS_KEY=ci-only-secret-key \
            -v "$PWD/infra/docker/seaweedfs/entrypoint.sh:/opt/icon/entrypoint.sh:ro" \
            --entrypoint /bin/sh chrislusf/seaweedfs:4.54 /opt/icon/entrypoint.sh
          for i in $(seq 1 60); do curl -sf http://localhost:8333/healthz && break; sleep 1; done

      - name: Install headless Chromium for PDF generation
        run: node node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Format check
        run: bun run format:check

      - name: Lint, typecheck, unit tests, build
        run: bunx turbo run lint typecheck test build

      - name: Integration tests (PostgreSQL, Redis)
        run: bunx turbo run test:integration
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://icon:ci-only-password@localhost:5432/icon_service_test?schema=public
          # parseEnv requires DATABASE_URL; the harness overrides it with TEST_DATABASE_URL.
          DATABASE_URL: postgresql://icon:ci-only-password@localhost:5432/icon_service_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-only-integration-secret-not-used-anywhere-else
          OTP_PEPPER: ci-only-otp-pepper-not-used-anywhere-else-000
          S3_ENDPOINT: http://localhost:8333
          S3_REGION: local
          S3_ACCESS_KEY_ID: ci-only-access-key
          S3_SECRET_ACCESS_KEY: ci-only-secret-key
          S3_BUCKET: icon-test
          S3_FORCE_PATH_STYLE: 'true'
          SMTP_HOST_PORT: '1025'
          MAILPIT_API_URL: http://localhost:8025

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Dependency audit (fails on high/critical; exceptions in docs/security/dependency-audit.md)
        run: bun run audit

      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1
